name: Deploy BookItAll to AWS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Test AWS SSH
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          set -x

          echo "HOST: $AWS_HOST"
          echo "USER: $AWS_USER"

          mkdir -p ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/bookitall_key
          chmod 600 ~/.ssh/bookitall_key

          echo "=== PORT 22 TEST ==="
          timeout 10 bash -c "</dev/tcp/$AWS_HOST/22" \
            && echo "PORT_22_OPEN" \
            || echo "PORT_22_FAILED"

          echo "=== SSH TEST ==="
          ssh -vvv \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o BatchMode=yes \
            -i ~/.ssh/bookitall_key \
            "$AWS_USER@$AWS_HOST" "echo SSH_SUCCESS"

          echo "=== SSH TEST FINISHED ==="
