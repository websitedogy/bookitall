name: Deploy BookItAll to AWS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/bookitall_key
          chmod 600 ~/.ssh/bookitall_key

          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o BatchMode=yes \
            -i ~/.ssh/bookitall_key \
            "$AWS_USER@$AWS_HOST" << 'EOF'

            set -e

            echo "=== DEPLOYING BOOKITALL ==="

            cd /home/ec2-user/bookitall

            echo "=== Sync GitHub master ==="
            git fetch origin master
            git reset --hard origin/master
            git clean -fd

            echo "=== Backend ==="
            cd /home/ec2-user/bookitall/backend
            npm ci
            npm run build

            echo "=== Frontend ==="
            cd /home/ec2-user/bookitall/frontend
            npm ci
            npm run build

            echo "=== Restart backend ==="
            sudo systemctl restart bookitall-backend.service

            echo "=== Restart frontend ==="
            sudo systemctl restart bookitall-frontend.service

            echo "=== Check backend ==="
            sudo systemctl is-active --quiet bookitall-backend.service

            echo "=== Check frontend ==="
            sudo systemctl is-active --quiet bookitall-frontend.service

            echo "=== DEPLOYMENT SUCCESSFUL ==="

          EOF
