services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: bookitall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookitall
      POSTGRES_PASSWORD: bookitall
      POSTGRES_DB: bookitall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookitall -d bookitall"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bookitall-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
